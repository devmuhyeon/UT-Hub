<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		
		<title>고용24 사용자 조사 - 결과 전송</title>

		<link rel="stylesheet" href="/ut-work24/css/reset.css">
		<link rel="stylesheet" href="/ut-work24/css/font.css">
		<link rel="stylesheet" href="/ut-work24/css/common.css">
		<link rel="stylesheet" href="/ut-work24/css/survey.css">
		<link rel="stylesheet" href="/ut-work24/css/upload.css">
		<link rel="stylesheet" href="/ut-work24/css/responsive.css">
	</head>

	<body>
		<div class="result_wrap">
			<div class="loading_card">

				<strong class="result_title">테스트 결과를 제출중입니다.</strong>
				<p class="result_message" role="status" aria-live="polite">잠시만 기다려주세요.</p>
				<div class="loading_bar" aria-hidden="true"></div>
			</div>
		</div>
		<div class="answer_popup" hidden>
			<div class="answer_popup_dim"></div>
			<div class="answer_popup_inner">
				<button type="button" class="btn_answer_close" aria-label="팝업 닫기">✕</button>
				<h5>메뉴 정답 화면</h5>
				<img src="/ut-work24/images/ttt-b.png" alt="메뉴 정답 예시 화면">
			</div>
		</div>
		
		<script src="../../../include/js/jquery-3.7.1.min.js"></script>
		<script src="/ut-work24/js/ut-d-common.js"></script>
		<script src="../../../include/ut_common/js/lock_back.js"></script>
		<script>
			$(function () {

				var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx9qdi4ILik1KfsuBYDQnR--DU5c8hKjpJW-9O6gVBe4i657cASwn7MFK_W40hP-IZezw/exec';

				var SEND_LOCK_KEY = 'ut_upload_sent';
				var SEND_LOCK_VALUE = 'Y';

				function setMessage(title, message) {
					$('.loading_bar').hide();
					$('.result_title').text(title);
					$('.result_message').html(message);
				}

				function pad(num) {
					return String(num).padStart(2, '0');
				}

				function makeUserId() {
					var savedId = sessionStorage.getItem('user_ut_id');

					if (savedId) {
						return savedId;
					}

					var group = sessionStorage.getItem('ut_group') || 'D';
					var now = new Date();

					var yy = String(now.getFullYear()).slice(2);
					var mm = pad(now.getMonth() + 1);
					var dd = pad(now.getDate());
					var dateStr = yy + mm + dd;

					var seqKey = 'ut_seq_' + group + '_' + dateStr;
					var seq = Number(localStorage.getItem(seqKey) || 0) + 1;

					localStorage.setItem(seqKey, seq);

					var userId = group + '-' + dateStr + '-' + pad(seq);

					sessionStorage.setItem('user_ut_id', userId);

					return userId;
				}

				function hasValue(obj) {
					var hasData = false;

					$.each(obj, function (_, value) {
						if (
							value !== null &&
							value !== undefined &&
							String(value).trim() !== ''
						) {
							hasData = true;
							return false;
						}
					});

					return hasData;
				}

				function getSheetName(group) {
					if (group === 'A' || group === 'B') {
						return 'DB_typeA';
					}

					if (group === 'C' || group === 'D') {
						return 'DB_typeB';
					}

					return '';
				}

				if (sessionStorage.getItem(SEND_LOCK_KEY) === SEND_LOCK_VALUE) {
					setMessage(
						'이미 제출되었습니다.',
						'중복 제출을 방지하기 위해 추가 전송하지 않았습니다.'
					);
					return;
				}

				var group = sessionStorage.getItem('ut_group') || 'C';
				var sheetName = getSheetName(group);

				var surveyData = UT.getSurvey();
				var taskData = UT.getTaskResult();
				var coSurvey = JSON.parse(sessionStorage.getItem('utCoSurvey') || '{}');

				var typeBAsis = taskData.typeBAsis || {};
				var typeBTobe = taskData.typeBTobe || {};

				if (
					!hasValue(surveyData) ||
					!hasValue(typeBAsis) ||
					!hasValue(typeBTobe)
				) {
					setMessage(
						'제출할 데이터가 없습니다.',
						'테스트를 정상적으로 완료한 뒤 다시 제출해 주세요.'
					);
					return;
				}

				sessionStorage.setItem(SEND_LOCK_KEY, SEND_LOCK_VALUE);

				var resultData = {
					sheetName: sheetName,

					groupNo: group,
					userId: makeUserId(),
					createdAt: new Date().toISOString(),

					age: surveyData.age || '',
					experience: surveyData.experience || '',
					member: surveyData.member || '',

					typeBAsisTargetMenu: typeBAsis.targetMenu || '',
					typeBAsisFinalClickMenu: typeBAsis.finalClickMenu || '',
					typeBAsisFailReason: typeBAsis.failReason || '',
					typeBAsisClickCount: typeBAsis.clickCount || '',
					typeBAsisDuration: typeBAsis.duration || '',
					typeBAsisClickPath: typeBAsis.clickPath || '',

					typeBTobeTargetMenu: typeBTobe.targetMenu || '',
					typeBTobeFinalClickMenu: typeBTobe.finalClickMenu || '',
					typeBTobeFailReason: typeBTobe.failReason || '',
					typeBTobeClickCount: typeBTobe.clickCount || '',
					typeBTobeDuration: typeBTobe.duration || '',
					typeBTobeClickPath: typeBTobe.clickPath || '',
					improveText: coSurvey.improveText || '',

					userAgent: navigator.userAgent
				};

				fetch(WEB_APP_URL, {
					method: 'POST',
					mode: 'no-cors',
					headers: {
						'Content-Type': 'text/plain;charset=utf-8'
					},
					body: JSON.stringify(resultData)
				})
				// .then(function () {
				// 	setMessage(
				// 		'답변이 제출되었습니다.',
				// 		'설문이 완료되었습니다. 감사합니다! 😊\n바쁘신 중에도 끝까지 참여해 주셔서 진심으로 감사드립니다.\n소중한 의견은 고용24 서비스 개선에 반영하겠습니다.'
				// 	);

				// 	UT.clearStorage();
				// })
				.then(function () {

					$('.loading_card').html(

						'<strong class="result_title">답변이 제출되었습니다.</strong>' +

						'<p class="result_message">' +
							'설문이 완료되었습니다. 감사합니다! 😊<br>' +
							'바쁘신 중에도 끝까지 참여해 주셔서 진심으로 감사드립니다.<br>' +
							'소중한 의견은 고용24 서비스 개선에 반영하겠습니다.' +
						'</p>' +

						'<button type="button" class="btn_answer_open">' +
							'정답이 궁금하신가요?' +
						'</button>'

					);

					UT.clearStorage();
				})
				.catch(function () {
					sessionStorage.removeItem(SEND_LOCK_KEY);

					setMessage(
						'전송에 실패했습니다.',
						'새로고침 후 다시 시도해 주세요.'
					);
				});
				$(document).on(
					'click',
					'.btn_answer_open',
					function () {

						$('.answer_popup')
							.stop(true, true)
							.prop('hidden', false)
							.hide()
							.fadeIn(200);

					}
				);

				$(document).on(
					'click',
					'.btn_answer_close, .answer_popup_dim',
					function () {

						$('.answer_popup')
							.stop(true, true)
							.fadeOut(
								200,
								function () {

									$(this).prop(
										'hidden',
										true
									);

								}
							);

					}
				);

			});
			</script>
	</body>
</html>
