<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고용24 사용자 조사 - 설문 완료</title>
    <link rel="stylesheet" href="/UT-Hub/include/css/reset.css">
    <link rel="stylesheet" href="/UT-Hub/include/css/font.css">
    <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/ut-common.css">
    <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/survey.css">
    <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/responsive.css">
    <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/upload.css">
    <link rel="stylesheet" href="/UT-Hub/ut-allmenu/source/css/allmenu-theme.css">

    <style>
        .btn_answer_open[hidden], .answer_popup[hidden] {display:none!important}
        .answer_popup_inner h2 {margin:0 0 24px;padding-right:60px;font-size:24px;font-weight:700;line-height:1.5}
        .answer_dp_img p {margin:0 0 12px;line-height:1.5}
    </style>
</head>
<body>
    <div class="result_wrap">
        <main class="loading_card">
            <h1 class="result_title">결과를 확인하고 있습니다.</h1>
            <p class="result_message" role="status" aria-live="polite">잠시만 기다려 주세요.</p>
            <div class="loading_bar" aria-hidden="true"></div>
            <button type="button" class="btn_answer_open" hidden>정답이 궁금하신가요?</button>
        </main>
    </div>

    <div class="answer_popup" role="dialog" aria-modal="true" aria-labelledby="answerTitleA" hidden>
        <div class="answer_popup_dim" aria-hidden="true"></div>
        <div class="answer_popup_inner">
            <button type="button" class="btn_answer_close" aria-label="정답 안내 닫기">✕</button>
            <h2 id="answerTitleA">메뉴 정답 안내</h2>
            <div class="answer_dp_img">
                <img src="/UT-Hub/ut-allmenu/source/images/tobe_Q1.png" alt="메뉴 정답 예시 화면 - 토글">
                <img src="/UT-Hub/ut-allmenu/source/images/tobe_Q2.png" alt="메뉴 정답 예시 화면 - 1">
                <img src="/UT-Hub/ut-allmenu/source/images/tobe_Q3.png" alt="메뉴 정답 예시 화면 - 2">
                <img src="/UT-Hub/ut-allmenu/source/images/tobe_Q4.png" alt="메뉴 정답 예시 화면 - 3">
            </div>
        </div>
    </div>

    <script src="/UT-Hub/include/js/jquery-3.7.1.min.js"></script>
    <script src="/UT-Hub/include/ut_common/js/lock_back.js"></script>
    <script src="/UT-Hub/ut-allmenu/research/b/data/config-b.js"></script>
    <script src="/UT-Hub/ut-allmenu/research/b/data/storage-b.js"></script>
    <script src="/UT-Hub/ut-allmenu/research/b/data/dropout-b.js"></script>
    <script>
        $(function () {
            'use strict';

            // 고용24 전체메뉴 B타입 Apps Script 웹앱 배포 URL
            var WEB_APP_URL = UT_B_CONFIG.webAppUrl;
            var LOCK_KEY = 'utAllmenuBUploadRequested';
            var PAYLOAD_KEY = 'utAllmenuBUploadPayload';
            var ID_KEY = 'utAllmenuBSubmissionId';
            var $popup = $('.answer_popup');

            function message(title, text, loading) {
                $('.loading_bar').toggle(loading === true);
                $('.result_title').text(title);
                $('.result_message').text(text);
            }

            function readJson(key) {
                try {
                    return JSON.parse(sessionStorage.getItem(key) || '{}');
                } catch (ignore) {
                    return {};
                }
            }

            function showAnswerButton() {
                $('.btn_answer_open').prop('hidden', false);
            }

            function getSubmissionId() {
                var id = sessionStorage.getItem(ID_KEY);
                if (!id) {
                    id = 'B-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
                    sessionStorage.setItem(ID_KEY, id);
                }
                return id;
            }

            var personal = UT_B.getSurvey();
            var tasks = UT_B.getTaskResult();
            var opinion = readJson('utAllmenuBCoSurvey');
            var keys = ['toggle', 'task1', 'task2', 'task3'];
            var validTasks = true;
            $.each(keys, function (_, key) {
                if (!tasks[key] || !/^(success|fail)$/.test(tasks[key].result)) {
                    validTasks = false;
                    return false;
                }
            });

            if (!personal.age || !personal.experience || !personal.member || !validTasks ||
                !opinion.survey1 || !opinion.survey3 || !opinion.survey4) {
                message('제출할 데이터가 부족합니다.', '설문을 순차적으로 진행해주세요.');
                return;
            }

            var resultData = {
                groupNo: 'B',
                testType: 'TO-BE',
                submissionId: getSubmissionId(),
                age: personal.age,
                experience: personal.experience,
                member: personal.member,
                agree: personal.agree || '',
                toggle: tasks.toggle,
                task1: tasks.task1,
                task2: tasks.task2,
                task3: tasks.task3,
                survey1: opinion.survey1,
                survey2: opinion.survey2 || '',
                survey2Other: opinion.survey2Other || '',
                survey3: opinion.survey3,
                survey4: opinion.survey4,
                survey4Other: opinion.survey4Other || '',
                userAgent: navigator.userAgent
            };

            sessionStorage.setItem(PAYLOAD_KEY, JSON.stringify(resultData));

            var checking = false;
            var $retry = $('<button>', {type: 'button', text: '저장 여부 확인 후 다시 제출', hidden: true})
                .addClass('btn_submit').insertBefore('.btn_answer_open');

            function complete() {
                sessionStorage.setItem('utAllmenuBUploadComplete', resultData.submissionId);
                $retry.prop('hidden', true);
                message('설문 제출이 완료되었습니다.', '설문에 참여해 주셔서 감사합니다.');
                showAnswerButton();
            }
            function status(callback) {
                $.ajax({url: WEB_APP_URL, dataType: 'jsonp', timeout: 15000,
                    data: {action: 'status', submissionId: resultData.submissionId}
                }).done(function (response) {
                    callback(response && response.ok === true ? response.saved === true : null);
                }).fail(function () { callback(null); });
            }
            function verify(attempt) {
                message('저장 여부를 확인하고 있습니다.', '잠시만 기다려 주세요.', true);
                status(function (saved) {
                    if (saved === true) { checking = false; complete(); return; }
                    if (attempt < 3) { setTimeout(function () { verify(attempt + 1); }, 2500); return; }
                    checking = false;
                    message('저장 완료를 확인하지 못했습니다.', '응답은 이 탭에 보관 중입니다. 아래 버튼으로 확인 후 다시 제출해 주세요.');
                    $retry.prop('hidden', false);
                });
            }
            function submit() {
                sessionStorage.setItem(LOCK_KEY, 'true');
                $retry.prop('hidden', true);
                message('결과를 저장하고 있습니다.', '잠시만 기다려 주세요.', true);
                // POST 응답을 읽지 못해도 서버의 고유 ID 조회로 실제 저장 여부를 확인.
                $.ajax({url: WEB_APP_URL, method: 'POST', data: JSON.stringify(resultData),
                    processData: false, contentType: 'text/plain;charset=utf-8',
                    crossDomain: true, timeout: 15000
                }).always(function () { verify(0); });
            }
            $retry.on('click', function () {
                if (checking) return;
                checking = true;
                $retry.prop('hidden', true);
                message('저장 여부를 확인하고 있습니다.', '잠시만 기다려 주세요.', true);
                status(function (saved) {
                    if (saved === true) { checking = false; complete(); }
                    else if (saved === false) submit();
                    else {
                        checking = false;
                        message('서버 연결을 확인할 수 없습니다.', '잠시 후 다시 시도해 주세요.');
                        $retry.prop('hidden', false);
                    }
                });
            });
            if (sessionStorage.getItem('utAllmenuBUploadComplete') === resultData.submissionId) complete();
            else if (!WEB_APP_URL) message('제출 서버가 설정되지 않았습니다.', '조사 담당자에게 문의해 주세요.');
            else {
                checking = true;
                if (sessionStorage.getItem(LOCK_KEY) === 'true') verify(0);
                else submit();
            }

            function closeAnswer() {
                $popup.stop(true, true).fadeOut(150, function () {
                    $popup.prop('hidden', true);
                    $('.result_wrap').prop('inert', false).removeAttr('aria-hidden');
                    $('.btn_answer_open').trigger('focus');
                });
            }

            $('.btn_answer_open').on('click', function () {
                $('.result_wrap').prop('inert', true).attr('aria-hidden', 'true');
                $popup.prop('hidden', false).stop(true, true).hide().fadeIn(150, function () {
                    $popup.find('.btn_answer_close').trigger('focus');
                });
            });
            $('.btn_answer_close,.answer_popup_dim').on('click', closeAnswer);
            $(document).on('keydown', function (event) {
                if ($popup.prop('hidden')) return;
                if (event.which === 27) {
                    event.preventDefault();
                    closeAnswer();
                } else if (event.which === 9) {
                    event.preventDefault();
                    $popup.find('.btn_answer_close').trigger('focus');
                }
            });
        });
    </script>
</body>
</html>
