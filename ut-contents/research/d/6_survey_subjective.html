<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="/UT-Hub/include/css/reset.css">
        <link rel="stylesheet" href="/UT-Hub/include/css/font.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/ut-common.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/survey.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/responsive.css">
		<link rel="stylesheet" href="/UT-Hub/include/ut_common/css/subjective.css">
        <style>
            #question1[hidden], #submitArea[hidden] {display: none;}
            #prior_question .option_list {grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));}
            #prior_question input:focus + label {outline: 2px solid #111; outline-offset: 3px;}
        </style>
		<title>고용24 사용자 조사</title>
	</head>
	<body>

		<div class="survey_wrap">
			<form id="surveyForm" class="survey_box" novalidate>
				<input type="hidden" id="user_ut_id" name="user_ut_id">
				<div class="survey_head">
					<span class="survey_badge">고용24 사용자 경험 조사</span>
					<h1 class="survey_title">주관식 의견 조사</h1>
					<p class="survey_desc">앞서 확인한 화면들에 대한 사용 경험과 느낀 점을 자유롭게 작성해 주세요.</p>
					<ol class="step_list" aria-label="조사 진행 단계">
						<li><span class="sr_only">고용24 사용자 경험 조사</span></li>
						<li><span class="sr_only">참여 전 확인</span></li>
						<li><span class="sr_only">설문 방법 안내</span></li>
						<li><span class="sr_only">메뉴 탐색 테스트</span></li>
						<li class="is_current"><span class="sr_only">현재 단계: 주관식 의견 조사</span></li>
						<li><span class="sr_only">결과 제출</span></li>
					</ol>
				</div>

				<div class="survey_body">
					<fieldset class="fieldset_group" id="question1" role="radiogroup" aria-labelledby="prior_title">
						<p class="question_desc" id="prior_title">1. [6월]에 고용24 뉴스레터로 받은 설문(메뉴 탐색 테스트, 콘텐츠 홈 선호도 조사)에 참여하신 적이 있나요?</p>
						<div class="option_list">
							<div class="option_item">
								<input type="radio" id="prior_yes" name="priorParticipation" value="참여함" required>
								<label for="prior_yes">참여함</label>
							</div>
							<div class="option_item">
								<input type="radio" id="prior_no" name="priorParticipation" value="참여하지 않음" required>
								<label for="prior_no">참여하지 않음</label>
							</div>
						</div>
					</fieldset>
					<fieldset class="fieldset_group mt40" id="question2" aria-labelledby="improve_title" hidden>
						<p class="question_desc" id="improve_title">2. 개선 사항이나 의견이 있으시면 작성해 주세요.<span class="question_sub">(선택 사항)</span>
						</p>
						<div class="textarea_wrap">
							<label for="improve_text" class="sr_only">개선 의견 입력</label>
							<textarea id="improve_text" name="improve_text" class="survey_textarea" rows="6" maxlength="100" placeholder="답변을 입력해주세요." aria-describedby="improve_count"></textarea>
							<p class="text_count" id="improve_count" aria-live="polite"><span class="current_count">0</span> / 100</p>
						</div>
					</fieldset> 
					<div class="button_area" id="submitArea" hidden>
						<button type="button" class="btn_submit" id="btnSubmit">최종 제출</button>
					</div>
				</div>
			</form>
		</div>
		<script src="/UT-Hub/include/js/jquery-3.7.1.min.js"></script>
		<script src="/UT-Hub/include/ut_common/js/lock_back.js"></script>
		
		<script src="/UT-Hub/ut-contents/research/d/data/storage-d.js"></script>
		<script>
			document.addEventListener('DOMContentLoaded', function () {

				var form = document.getElementById('surveyForm');
				var textarea = document.getElementById('improve_text');
				var count = document.querySelector('#improve_count .current_count');
				var btnSubmit = document.getElementById('btnSubmit');
				var maxLength = textarea ? Number(textarea.getAttribute('maxlength')) || 100 : 100;

				function updateCount() {
					if (!textarea || !count) return;

					if (textarea.value.length > maxLength) {
						textarea.value = textarea.value.substring(0, maxLength);
					}

					count.textContent = textarea.value.length;
				}

				function saveAndMove() {
                    var priorParticipation = $('input[name="priorParticipation"]:checked').val();
                    if (!priorParticipation) {
                        alert('사전평가 참여 유무를 선택해 주세요.');
                        $('#prior_yes').trigger('focus');
                        return;
                    }

					var improveText = textarea ? textarea.value.trim() : '';

					sessionStorage.setItem(
						'utDCoSurvey',
						JSON.stringify({
							improveText: improveText,
							priorParticipation: priorParticipation
						})
					);

					location.href = '/UT-Hub/ut-contents/research/d/7_upload.html';
				}

				/* form 기본 GET 전송 강제 차단 */
				if (form) {
					form.setAttribute('method', 'post');
					form.setAttribute('action', 'javascript:void(0);');

					form.addEventListener('submit', function (e) {
						e.preventDefault();
						e.stopPropagation();

						saveAndMove();

						return false;
					}, true);
				}

				if (textarea) {
					textarea.addEventListener('input', updateCount);
					updateCount();
				}

				if (btnSubmit) {
					btnSubmit.setAttribute('type', 'button');

					btnSubmit.addEventListener('click', function (e) {
						e.preventDefault();
						e.stopPropagation();

						saveAndMove();

						return false;
					}, true);
				}

			});
		</script>
        <script>
            $(function () {
                function showNextQuestion() {
                    var $target = $('#question1');
                    if (!$('input[name="priorParticipation"]:checked').length || !$target.prop('hidden')) return;

                    var duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 240;
                    $target.prop('hidden', false).hide().slideDown(duration, function () {
                        $target.find('.question_desc').attr('tabindex', '-1').trigger('focus');
                    });
                    $('#submitArea').prop('hidden', false).css('display', 'flex').hide().slideDown(duration);
                }

                $('input[name="priorParticipation"]').on('change', showNextQuestion);
                showNextQuestion();
            });
        </script>
	</body>
</html>
