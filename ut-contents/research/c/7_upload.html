<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>고용24 사용자 조사 - 결과 전송</title>
		<link rel="stylesheet" href="/include/css/reset.css">
        <link rel="stylesheet" href="/include/css/font.css">
        <link rel="stylesheet" href="/include/ut_common/css/ut-common.css">
        <link rel="stylesheet" href="/include/ut_common/css/survey.css">
        <link rel="stylesheet" href="/include/ut_common/css/responsive.css">
		<link rel="stylesheet" href="/include/ut_common/css/upload.css">
	</head>

	<body>
		<div class="result_wrap">
			<div class="loading_card">
				<strong class="result_title">테스트 결과를 제출중입니다.</strong>
				<p class="result_message" role="status" aria-live="polite">잠시만 기다려주세요.</p>
				<div class="loading_bar" aria-hidden="true"></div>
			</div>
		</div>

		<div class="answer_popup" hidden>
			<div class="answer_popup_dim"></div>
			<div class="answer_popup_inner">
				<button type="button" class="btn_answer_close" aria-label="팝업 닫기">✕</button>
				<h5>메뉴 정답 화면</h5>
				<img src="/ut-work24/images/ttt-a.png" alt="메뉴 정답 예시 화면">
			</div>
		</div>

		
		<script src="/include/js/jquery-3.7.1.min.js"></script>
		<script src="/include/ut_common/js/lock_back.js"></script>
		
		<script src="/ut-contents/research/c/data/storage-c.js"></script>
		<script>
			$(function () {
				'use strict';

				var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxc-IJIOZ8lJ5WxrugOyMlhpJiZ7QkMxT-2h-d81uUn4Bt485Rqqcjr964t_CkU1JkvwA/exec';

				var SEND_LOCK_KEY = 'utCUploadRequested';
				var $popup = $('.answer_popup');

				// 안내 메시지
				function setMessage(title, message) {
					$('.loading_bar').hide();
					$('.result_title').text(title);
					$('.result_message').text(message);
				}

				// 세션 데이터 조회
				function readJson(key) {
					try {
						return JSON.parse(
							sessionStorage.getItem(key) || '{}'
						);
					} catch (err) {
						return {};
					}
				}

				// 데이터 값 반환
				function value(data, key) {
					return data[key] === undefined ||
						data[key] === null
						? ''
						: data[key];
				}

				// 저장 스크립트 확인
				if (typeof UT_C === 'undefined') {
					setMessage(
						'스크립트를 불러오지 못했습니다.',
						'storage-c.js 경로를 확인해 주세요.'
					);
					return;
				}

				// 중복 전송 방지
				if (sessionStorage.getItem(SEND_LOCK_KEY) === 'Y') {
					setMessage(
						'전송 요청 이력이 있습니다.',
						'중복 전송을 막기 위해 다시 전송하지 않았습니다. 구글 시트 c 탭에서 저장 여부를 확인해 주세요.'
					);
					return;
				}

				// 저장된 데이터 조회
				var surveyData = UT_C.getSurvey();
				var taskData = UT_C.getTaskResult();
				var coSurvey = readJson('utCoSurvey');

				var asis = taskData.typeCAsis || {};
				var tobe = taskData.typeCTobe || {};

				// 필수 데이터 확인
				if (
					!surveyData.age ||
					!surveyData.experience ||
					!surveyData.member ||
					(asis.result !== 'success' && asis.result !== 'fail') ||
					(tobe.result !== 'success' && tobe.result !== 'fail')
				) {
					setMessage(
						'제출할 데이터가 부족합니다.',
						'사전 설문과 As-is, To-be 화면 탐색을 모두 완료해야 결과를 제출할 수 있습니다.'
					);
					return;
				}

				// 구글 시트 전송 데이터
				var resultData = {
					groupNo: 'C',

					// 사전 설문
					age: value(surveyData, 'age'),
					experience: value(surveyData, 'experience'),
					member: value(surveyData, 'member'),

					// AS-IS 결과
					typeCAsisTargetMenu: value(asis, 'targetMenu'),
					typeCAsisFinalClickMenu: value(asis, 'finalClickMenu'),
					typeCAsisFailReason: value(asis, 'failReason'),
					typeCAsisClickCount: value(asis, 'clickCount'),
					typeCAsisDuration: value(asis, 'duration'),
					typeCAsisClickPath: value(asis, 'clickPath'),

					// TO-BE 결과
					typeCTobeTargetMenu: value(tobe, 'targetMenu'),
					typeCTobeFinalClickMenu: value(tobe, 'finalClickMenu'),
					typeCTobeFailReason: value(tobe, 'failReason'),
					typeCTobeClickCount: value(tobe, 'clickCount'),
					typeCTobeDuration: value(tobe, 'duration'),
					typeCTobeClickPath: value(tobe, 'clickPath'),

					// 주관식 및 브라우저
					improveText: value(coSurvey, 'improveText'),
					userAgent: navigator.userAgent
				};

				// 전송 요청 잠금
				sessionStorage.setItem(SEND_LOCK_KEY, 'Y');

				// Google Apps Script 전송
				fetch(WEB_APP_URL, {
					method: 'POST',
					mode: 'no-cors',
					headers: {
						'Content-Type': 'text/plain;charset=utf-8'
					},
					body: JSON.stringify(resultData)
				})
				.then(function () {
					setMessage(
						'전송 요청이 완료되었습니다.',
						'실제 저장 여부는 구글 스프레드시트 c 탭에서 확인해 주세요.'
					);

					$('.loading_card').append(
						'<button type="button" class="btn_answer_open">' +
						'정답이 궁금하신가요?' +
						'</button>'
					);

					// 서버 저장 확인 전 데이터 삭제하지 않음
				})
				.catch(function () {
					sessionStorage.removeItem(SEND_LOCK_KEY);

					setMessage(
						'전송 요청에 실패했습니다.',
						'인터넷 연결을 확인하고 새로고침해 다시 시도해 주세요.'
					);
				});

				// 정답 팝업 열기
				$(document).on(
					'click',
					'.btn_answer_open',
					function () {
						$('.result_wrap')
							.prop('inert', true)
							.attr('aria-hidden', 'true');

						$popup
							.prop('hidden', false)
							.hide()
							.fadeIn(200, function () {
								$(this)
									.find('.btn_answer_close')
									.trigger('focus');
							});
					}
				);

				// 정답 팝업 닫기
				function closeAnswer() {
					$popup
						.stop(true, true)
						.fadeOut(200, function () {
							$popup.prop('hidden', true);

							$('.result_wrap')
								.prop('inert', false)
								.removeAttr('aria-hidden');

							$('.btn_answer_open').trigger('focus');
						});
				}

				$(document).on(
					'click',
					'.btn_answer_close, .answer_popup_dim',
					closeAnswer
				);

				// 팝업 키보드 접근성
				$(document).on('keydown', function (e) {
					if ($popup.prop('hidden')) return;

					// ESC 닫기
					if (e.which === 27) {
						e.preventDefault();
						closeAnswer();
					}

					// 포커스 순환
					else if (e.which === 9) {
						e.preventDefault();

						$popup
							.find('.btn_answer_close')
							.trigger('focus');
					}
				});
			});
		</script>
	</body>
</html>
