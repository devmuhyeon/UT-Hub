<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="/UT-Hub/include/css/reset.css">
        <link rel="stylesheet" href="/UT-Hub/include/css/font.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/ut-common.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/survey.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/responsive.css">
		<link rel="stylesheet" href="/UT-Hub/include/ut_common/css/subjective.css">
		<title>고용24 사용자 조사 - 이전 조사 참여 확인</title>
	</head>
	<body>

		<div class="survey_wrap">
			<form id="surveyForm" class="survey_box" novalidate>
				<input type="hidden" id="user_ut_id" name="user_ut_id">
				<div class="survey_head">
					<span class="survey_badge">고용24 사용자 경험 조사</span>
					<h1 class="survey_title">이전 조사 참여 확인</h1>
					<p class="survey_desc">정확한 결과 분석을 위해 이전 조사 참여 여부를 선택해주세요.</p>
					<ol class="step_list" aria-label="조사 진행 단계">
						<li><span class="sr_only">고용24 사용자 경험 조사</span></li>
						<li><span class="sr_only">참여 전 확인</span></li>
						<li><span class="sr_only">설문 방법 안내</span></li>
						<li><span class="sr_only">메뉴 탐색 테스트</span></li>
						<li class="is_current" aria-current="step"><span class="sr_only">현재 단계: 이전 조사 참여 확인</span></li>
						<li><span class="sr_only">주관식 의견 조사</span></li>
						<li><span class="sr_only">결과 제출</span></li>
					</ol>
				</div>

				<div class="survey_body">
					<div class="fieldset_group" id="question1" role="radiogroup" aria-labelledby="prior_title">
						<p class="question_desc" id="prior_title">[6월]에 고용24 뉴스레터로 받은 설문(메뉴 탐색 테스트, 콘텐츠 홈 선호도 조사)에 참여하신 적이 있나요?</p>
						<div class="option_list">
							<div class="option_item">
								<input type="radio" id="prior_yes" name="priorParticipation" value="참여함" required>
								<label for="prior_yes">참여함</label>
							</div>
							<div class="option_item">
								<input type="radio" id="prior_no" name="priorParticipation" value="참여하지 않음" required>
								<label for="prior_no">참여하지 않음</label>
							</div>
						</div>
					</div>
					<div class="button_area" id="submitArea">
						<button type="submit" class="btn_submit" id="btnSubmit">다음</button>
					</div>
				</div>
			</form>
		</div>
		<script src="/UT-Hub/include/js/jquery-3.7.1.min.js"></script>
		<script src="/UT-Hub/include/ut_common/js/lock_back.js"></script>
		
		<script src="/UT-Hub/ut-contents/research/a/data/storage-a.js"></script>

        <script>
            $(function () {
                var key = 'utACoSurvey';
                var saved = {};
                try {
                    saved = JSON.parse(sessionStorage.getItem(key) || '{}') || {};
                } catch (err) {
                    saved = {};
                }
                $('input[name="priorParticipation"]').each(function () {
                    $(this).prop('checked', $(this).val() === saved.priorParticipation);
                });
                $('#surveyForm').on('submit', function (e) {
                    e.preventDefault();
                    var priorParticipation = $('input[name="priorParticipation"]:checked').val();
                    if (!priorParticipation) {
                        alert('사전평가 참여 유무를 선택해 주세요.');
                        $('#prior_yes').trigger('focus');
                        return;
                    }
                    saved.priorParticipation = priorParticipation;
                    sessionStorage.setItem(key, JSON.stringify(saved));
                    location.href = '/UT-Hub/ut-contents/research/a/7_survey_subjective.html';
                });
            });
        </script>
    </body>
</html>
