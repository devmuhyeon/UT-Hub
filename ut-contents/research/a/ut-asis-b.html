<!DOCTYPE html>
<html lang="ko" style="overflow: hidden;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		
		<title>고용24 사용자 조사 - 메뉴 탐색 테스트</title>

		<link rel="stylesheet" href="/ut-work24/css/reset.css">
		<link rel="stylesheet" href="/ut-work24/css/font.css">
		<link rel="stylesheet" href="/ut-work24/css/common.css">
		<link rel="stylesheet" href="/ut-work24/css/survey.css">
		<link rel="stylesheet" href="/ut-work24/css/ut-test.css">
		<link rel="stylesheet" href="/ut-work24/css/responsive.css">
	</head>

	<body>

		<div id="utPage" class="ut_page" aria-hidden="true">
			<iframe id="testFrame" class="ut_frame" title="고용24 화면 탐색 테스트 화면" src="/ut-work24/asis-b.html" style="overflow-x: hidden;"></iframe>
			<div class="step_floating" role="status" aria-live="polite">
				<div class="survey_head">
					<p class="survey_infotxt">화면에서 <span class="aaa_info">'고용정책'</span> 메뉴를 찾아주세요.</p>

					<ol class="step_list" aria-label="조사 진행 단계">
                        <li><span class="sr_only">고용24 사용자 경험 조사</span></li>
                        <li><span class="sr_only">참여 전 확인</span></li>
                        <li><span class="sr_only">설문 방법 안내</span></li>
                        <li class="is_current"><span class="sr_only">현재 단계: 메뉴 탐색 테스트</span></li>
						<li><span class="sr_only">주관식 의견 조사</span></li>
                        <li><span class="sr_only">결과 제출</span></li>
                    </ol>
				</div>
			</div>
		</div>

		<!-- 성공 팝업 -->
		<div id="successPopup" class="ut_result_overlay" role="dialog" aria-modal="true" aria-labelledby="successTitle" aria-describedby="successDesc" hidden>
			<div class="ut_result_box">
				<span class="survey_logo"><img src="/ut-work24/images/logo.svg"></span>
				<h2 id="successTitle" class="ut_alert_title">메뉴를 찾으셨네요!</h2>
				<p id="successDesc" class="ut_alert_desc">다음 단계로 넘어갑니다.</p>
				<button type="button" class="btn_next">두번째 테스트로 이동</button>
			</div>
		</div>

		<!-- 실패 사유 팝업 -->
		<div id="failPopup" class="ut_result_overlay" role="dialog" aria-modal="true" aria-labelledby="failTitle" aria-describedby="failDesc" hidden>
			<div class="ut_result_box">
				<span class="survey_logo"><img src="/ut-work24/images/logo.svg"></span>
				<h2 id="failTitle" class="ut_alert_title">메뉴를 찾기 어려우셨나요?</h2>
				<p id="failDesc" class="ut_alert_desc">시간이 초과되었어요. <br>아래 질문에 답해주시면 다음 단계로 넘어갑니다.</p>
				<fieldset class="fail_radio_group">
					<legend class="sr_only">실패 이유 선택</legend>
					<div class="radio_item">
						<input type="radio" id="failReason01" name="failReason" value="메뉴가 눈에 잘 보이지 않아요.">
						<label for="failReason01">메뉴가 눈에 잘 보이지 않아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason02" name="failReason" value="다른 메뉴와 모양이 달라서 메뉴인줄 몰랐어요.">
						<label for="failReason02">다른 메뉴와 모양이 달라서 메뉴인줄 몰랐어요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason03" name="failReason" value="어느 메뉴 안에 있는지 모르겠어요.">
						<label for="failReason03">어느 메뉴 안에 있는지 모르겠어요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason04" name="failReason" value="메뉴가 너무 많아요.">
						<label for="failReason04">메뉴가 너무 많아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason05" name="failReason" value="메뉴 이름이 생소해요.">
						<label for="failReason05">메뉴 이름이 생소해요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason06" name="failReason" value="메뉴 이름이 기억나지 않아요.">
						<label for="failReason06">메뉴 이름이 기억나지 않아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason07" name="failReason" value="평소에 찾던 경로와 달라요.">
						<label for="failReason07">평소에 찾던 경로와 달라요.</label>
					</div>
				</fieldset>
				<button type="button" class="btn_next">두번째 테스트로 이동</button>
			</div>
		</div>

		<script src="/UT-Hub/include/js/jquery-3.7.1.min.js"></script>
		<script src="/ut-work24/js/ut-c-common.js"></script>
		<script src="/UT-Hub/include/ut_common/js/lock_back.js"></script>
		<script>
			$(function () {

				const LIMIT = 60 * 1000;
				const targetMenu = '고용정책';
				const startTimeKey = 'bTypeStartTime';

				let isFinished = false;
				let taskResult = null;
				const logKey = 'bTypeAsisClickLogs';

let savedLogData = {};

try {

	savedLogData = JSON.parse(
		sessionStorage.getItem(logKey) || '{}'
	);

} catch (e) {

	savedLogData = {};

}

let clickCount =
	Number(savedLogData.clickCount) || 0;

let timeoutTimer = null;

const clickLogs =
	$.isArray(savedLogData.clickLogs)
		? savedLogData.clickLogs
		: [];
				const $frame = $('#testFrame');

				const startTime =
					Number(sessionStorage.getItem(startTimeKey)) || Date.now();

				function saveClick($clicked) {

					var text = $.trim($clicked.text());

					if ($clicked.closest('.lnb').length) {
						text = 'lnb.' + text;
					}

					clickCount++;

					clickLogs.push({
						text: text,
						second: Number(((Date.now() - startTime) / 1000).toFixed(1))
					});

				}

				function makeResult(resultType, $clicked) {

					const endTime = Date.now();

					return {
						targetMenu: targetMenu,
						finalClickMenu: $clicked ? $.trim($clicked.text()) : '',
						failReason: '',
						clickCount: clickCount,
						duration: Number(((endTime - startTime) / 1000).toFixed(1)),
						clickPath: UT.makeClickPath(clickLogs),
						result: resultType,
						startTime: new Date(startTime).toISOString(),
						endTime: new Date(endTime).toISOString(),
						userAgent: navigator.userAgent
					};

				}

				function openSuccess($clicked) {

					if (isFinished) return;

					isFinished = true;
					clearTimeout(timeoutTimer);

					taskResult = makeResult('success', $clicked);

					$('#successPopup')
						.removeAttr('hidden')
						.hide()
						.fadeIn(200, function () {

							$(this)
								.find('.btn_next')
								.focus();

						});

				}

				function openFail() {

					if (isFinished) return;

					isFinished = true;
					clearTimeout(timeoutTimer);

					taskResult = makeResult('fail', null);

					$('#failPopup')
						.removeAttr('hidden')
						.hide()
						.fadeIn(200, function () {

							$(this)
								.find('input[name="failReason"]')
								.first()
								.focus();

						});

				}

				function bindFrameEvent() {

					try {

						const frame = $frame[0];

						if (
							!frame ||
							!frame.contentWindow ||
							!frame.contentWindow.document
						) {
							return;
						}

						const frameDoc = frame.contentWindow.document;

						$(frameDoc)
							.off('click.typeBAsis')
							.on('click.typeBAsis', 'a, button', function (e) {

								if (isFinished) return;

								const $clicked = $(this);

								saveClick($clicked);

								if (
									$clicked.attr('data-answer') === 'true'
								) {

									e.preventDefault();

									openSuccess($clicked);

								}

							});

					} catch (e) {

						console.log(e);

					}

				}

				$(document).on('change', 'input[name="failReason"]', function () {

					$('#failError').attr('hidden', true);

				});

				$(document).on('click', '.btn_next', function () {

					if (!taskResult) return;

					if (taskResult.result === 'fail') {

						const failReason =
							$('input[name="failReason"]:checked').val();

						if (!failReason) {

							$('#failError').removeAttr('hidden');

							$('input[name="failReason"]')
								.first()
								.focus();

							return;

						}

						$('#failError').attr('hidden', true);

						taskResult.failReason = failReason;

					}

					UT.saveTask(
	'typeBAsis',
	taskResult
);

sessionStorage.removeItem(logKey);
sessionStorage.removeItem(startTimeKey);

					sessionStorage.removeItem(startTimeKey);

					location.href =
						'/ut-work24/group_c/ut-tobe-b.html';

				});

				$frame.on('load', function () {

					setTimeout(function () {

						bindFrameEvent();

					}, 300);

				});

				const remainTime =
					LIMIT - (Date.now() - startTime);

				if (remainTime <= 0) {

					openFail();

					return;

				}

				timeoutTimer = setTimeout(function () {

					openFail();

				}, remainTime);

			});
		</script>
	</body>
</html>
