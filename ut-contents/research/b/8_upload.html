<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>고용24 사용자 조사 - 결과 전송</title>
		
		<link rel="stylesheet" href="/UT-Hub/include/css/reset.css">
        <link rel="stylesheet" href="/UT-Hub/include/css/font.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/ut-common.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/survey.css">
        <link rel="stylesheet" href="/UT-Hub/include/ut_common/css/responsive.css">
		<link rel="stylesheet" href="/UT-Hub/include/ut_common/css/upload.css">
	</head>

	<body>
		<div class="result_wrap">
			<div class="loading_card">
				<strong class="result_title">테스트 결과를 제출중입니다.</strong>
				<p class="result_message" role="status" aria-live="polite">잠시만 기다려주세요.</p>
				<div class="loading_bar" aria-hidden="true"></div>
			</div>
		</div>

		

		<div class="answer_popup" hidden>
			<div class="answer_popup_dim"></div>
			<div class="answer_popup_inner">
				<button type="button" class="btn_answer_close" aria-label="팝업 닫기">✕</button>
				<h5>메뉴 정답 화면</h5>
				<div class="answer_dp_img">
					<img src="/UT-Hub/ut-contents/source/images/employment_policy_asis.jpg" alt="메뉴 정답 예시 화면 As-is">
					<img src="/UT-Hub/ut-contents/source/images/employment_policy_tobe.jpg" alt="메뉴 정답 예시 화면 To-be">
				</div>
			</div>
		</div>

		
		<script src="/UT-Hub/include/js/jquery-3.7.1.min.js"></script>
		<script src="/UT-Hub/include/ut_common/js/lock_back.js"></script>
		
		<script src="/UT-Hub/ut-contents/research/b/data/storage-b.js"></script>

		<script>
			$(function () {
				'use strict';

				var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzZxmJuqI6XgW3yi7VbyKjo5pVI02_fdnLrpw4GPeRTBrYxHHcaG9351ZtR-n2KwfzUIg/exec';

				var SEND_LOCK_KEY = 'utBUploadRequested';
				var $popup = $('.answer_popup');

				// 안내 메시지
				function setMessage(title, message) {
					$('.loading_bar').hide();
					$('.result_title').text(title);
					$('.result_message').text(message);
				}

				// 팝업 접근성 속성 설정
				$popup.attr({
					'role': 'dialog',
					'aria-modal': 'true',
					'aria-labelledby': 'answerTitleB'
				});

				$popup.find('h5').first().attr('id', 'answerTitleB');
				$popup.find('.answer_popup_dim').attr('aria-hidden', 'true');

				// 정답 팝업 열기
				$(document).on('click', '.btn_answer_open', function () {

					$('.result_wrap')
						.prop('inert', true)
						.attr('aria-hidden', 'true');

					$popup
						.stop(true, true)
						.prop('hidden', false)
						.hide()
						.fadeIn(200, function () {
							$popup
								.find('.btn_answer_close')
								.trigger('focus');
						});
				});

				// 정답 팝업 닫기
				function closeAnswer() {

					$popup
						.stop(true, true)
						.fadeOut(200, function () {

							$popup.prop('hidden', true);

							$('.result_wrap')
								.prop('inert', false)
								.removeAttr('aria-hidden');

							$('.btn_answer_open').trigger('focus');
						});
				}

				$(document).on(
					'click',
					'.btn_answer_close, .answer_popup_dim',
					function () {
						closeAnswer();
					}
				);

				// 팝업 키보드 접근성
				$(document).on('keydown', function (e) {

					if ($popup.prop('hidden')) return;

					// ESC: 팝업 닫기
					if (e.which === 27) {
						e.preventDefault();
						closeAnswer();
						return;
					}

					// Tab: 팝업 내부 포커스 유지
					if (e.which === 9) {
						e.preventDefault();

						$popup
							.find('.btn_answer_close')
							.trigger('focus');
					}
				});

				// 저장 데이터 조회
				function readJson(key) {
					try {
						return JSON.parse(
							sessionStorage.getItem(key) || '{}'
						);
					} catch (err) {
						return {};
					}
				}

				// 데이터 값 반환
				function value(data, key) {
					return data[key] === undefined ||
						data[key] === null
						? ''
						: data[key];
				}

				// 저장 스크립트 확인
				if (typeof UT_B === 'undefined') {
					setMessage(
						'내용을 불러오지 못했습니다.'
					);
					return;
				}

				// 같은 탭에서 새로고침해도 전송 중/완료 이력이 있으면 재전송하지 않음
				var sendState;
				try {
					sendState = sessionStorage.getItem(SEND_LOCK_KEY);
				} catch (err) {
					setMessage('전송을 시작하지 않았습니다.', '브라우저 저장소를 사용할 수 없습니다. 저장소 설정을 확인해 주세요.');
					return;
				}
				if (sendState) {
					if (sendState === 'completed') {
						setMessage('이미 전송 요청이 완료되었습니다.', '중복 전송하지 않았습니다. 설문에 참여해 주셔서 감사합니다.');
						$('.loading_card').append(
						'<button type="button" class="btn_answer_open">' +
						'정답이 궁금하신가요?' +
						'</button>'
					);
					} else {
						setMessage('전송 요청 이력이 있습니다.', '새로고침을 사용할 수 없습니다.');
					}
					return;
				}

				// 설문 및 테스트 결과 조회
				var surveyData = UT_B.getSurvey();
				var taskData = UT_B.getTaskResult();
				var coSurvey = readJson('utBCoSurvey');

				var asis = taskData.typeBAsis || {};
				var tobe = taskData.typeBTobe || {};

				// 필수 데이터 검증
				if (
					!surveyData.age ||
					!surveyData.experience ||
					!surveyData.member ||
					(asis.result !== 'success' && asis.result !== 'fail') ||
					(tobe.result !== 'success' && tobe.result !== 'fail')
				) {
					setMessage(
						'제출할 데이터가 부족합니다.',
						'사전 설문과 화면 탐색을 모두 완료한 뒤 제출해 주세요.'
					);
					return;
				}

				// B그룹 전송 데이터
				var resultData = {
					groupNo: 'B',

					// 참여 전 확인
					age: value(surveyData, 'age'),
					experience: value(surveyData, 'experience'),
					member: value(surveyData, 'member'),

					// AS-IS
					typeBAsisTargetMenu1: value(asis, 'targetMenu1'),
					typeBAsisFinalClickMenu: value(asis, 'finalClickMenu'),
					typeBAsisFailReason: value(asis, 'failReason'),
					typeBAsisClickCount: value(asis, 'clickCount'),
					typeBAsisDuration: value(asis, 'duration'),
					typeBAsisClickPath: value(asis, 'clickPath'),

					// TO-BE
					typeBTobeTargetMenu2: value(tobe, 'targetMenu2'),
					typeBTobeFinalClickMenu: value(tobe, 'finalClickMenu'),
					typeBTobeFailReason: value(tobe, 'failReason'),
					typeBTobeClickCount: value(tobe, 'clickCount'),
					typeBTobeDuration: value(tobe, 'duration'),
					typeBTobeClickPath: value(tobe, 'clickPath'),

					// 주관식 및 브라우저
					improveText: value(coSurvey, 'improveText'),
					priorParticipation: value(coSurvey, 'priorParticipation'),
					userAgent: navigator.userAgent
				};


				// 요청 전에 잠금: 응답 대기 중 새로고침도 재전송하지 않음
				try {
					sessionStorage.setItem(SEND_LOCK_KEY, 'pending');
				} catch (err) {
					setMessage('전송을 시작하지 않았습니다.', '전송 이력을 저장할 수 없습니다. 브라우저 저장소 설정을 확인해 주세요.');
					return;
				}

				// 구글 스프레드시트 전송
				fetch(WEB_APP_URL, {
					method: 'POST',
					mode: 'no-cors',
					headers: {
						'Content-Type': 'text/plain;charset=utf-8'
					},
					body: JSON.stringify(resultData)
				})
				.then(function () {
					// no-cors 응답은 서버 저장 성공 여부를 확인할 수 없음
					try {
						sessionStorage.setItem(SEND_LOCK_KEY, 'completed');
					} catch (err) {
						// 기존 pending 잠금을 유지
					}

					setMessage(
						'전송 요청이 완료되었습니다.',
						'설문에 참여해 주셔서 감사합니다.'
					);

					$('.loading_card').append(
						'<button type="button" class="btn_answer_open">' +
						'정답이 궁금하신가요?' +
						'</button>'
					);

					// 저장 확인 전까지 세션 데이터 유지
				})
				.catch(function () {


					setMessage(
						'전송 결과를 확인하지 못했습니다.',
						'중복 전송 방지를 위해 자동 재전송하지 않습니다. 저장 여부는 조사 담당자에게 확인해 주세요.'
					);
				});


			});
		</script>

	</body>
</html>
